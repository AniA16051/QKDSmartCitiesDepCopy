# Mosquitto configuration for QKD Smart City Network

# Default listener
listener 1883
protocol mqtt
allow_anonymous true

# WebSocket listener (for web-based clients)
listener 9001
protocol websockets
allow_anonymous true

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
log_timestamp true

# Max connections
max_connections -1
max_queued_messages 1000

# Persistence
persistence true
persistence_location /mosquitto/data/

# Performance
max_inflight_messages 20
